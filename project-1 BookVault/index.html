<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookVault</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>📚 BookVault</h1>
        <form class="search-form">
            <input type="search" placeholder="Search books...">
            <button>Search</button>
        </form>

        <button class="open-form-btn" type="button">
    + Add Book
</button>
    </header>

<section class="form-container">
    <h2>Add New Book</h2>
    <form id="book-form">
        <input
            type="text"
            id="title"
            placeholder="Book Title"
            required
        >
        <input
            type="text"
            id="author"
            placeholder="Author"
            required
        >
        <input
            type="number"
            id="pages"
            placeholder="Pages"
            required
        >
        <label>
            <input type="checkbox" id="read">
            Already Read
        </label>
        <button class="submit-btn" type="submit">+ Add Book</button>
    </form>
</section>

    <main class="hero">
    <h2>Your Personal Digital Library</h2>

    <p>
        Organize your favorite books, track your reading progress,
        and build your own digital bookshelf.
    </p>
</main>

    <section class="statistics">
        <h2>Book Vault Statistics</h2>
        <div class="stats-grid">
            <div class="stat-box total">
                <h3>Total</h3>
                <p id="total-count">0</p>
            </div>
            <div class="stat-box read">
                <h3>Read</h3>
                <p id="read-count">0</p>
            </div>
            <div class="stat-box unread">
                <h3>Unread</h3>
                <p id="unread-count">0</p>
            </div>
            <div class="stat-box progress">
    <h3>Progress</h3>
    <p id="progress-count">0%</p>
</div>
        </div>
    </section>

    <section class="books">

    <h2>📚 Your Books</h2>

    <div class="book-container">
    
    </div>
    </section>

    <script src="script.js"></script>
</body>

</html>
